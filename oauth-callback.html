<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan Sheet — Google collegato</title></head>
<body><p id="message">Completamento del collegamento Google…</p>
<script>
(function(){
  'use strict';
  const p = new URLSearchParams(location.search);
  const result = {
    code: p.get('code') || '', state: p.get('state') || '', error: p.get('error') || '',
    errorDescription: p.get('error_description') || '', at: Date.now()
  };
  try { localStorage.setItem('scan-sheet:v3.1:oauth-result', JSON.stringify(result)); } catch (_) {}
  try { if (window.opener) window.opener.postMessage({type:'scan-sheet:oauth-result', result}, location.origin); } catch (_) {}
  document.getElementById('message').textContent = result.error ? 'Autorizzazione non completata. Torna a Scan Sheet.' : 'Google collegato. Torna a Scan Sheet.';
  if (window.opener) setTimeout(() => window.close(), 250);
  else setTimeout(() => location.replace('./?oauth=done'), 500);
})();
</script></body></html>
